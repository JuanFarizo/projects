%dev.quarkus.http.port=9999

# Protocol can be JSONRPC, GRPC, or HTTP+JSON
quarkus.agentcard.protocol=JSONRPC

# OpenTelemetry configuration
quarkus.otel.sdk.disabled=false
quarkus.observability.lgtm.grafana-port=3001
quarkus.observability.lgtm.otel-grpc-port=5317
quarkus.observability.lgtm.otel-http-port=5318
#quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1.}] %s%e%n
# Authorization is not configured in this application
a2a.authorization.required=false
