<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Upload Bank Statement</title>
</head>

<body>
    <h2>Upload Bank Statement (PDF)</h2>
    <form method="post" th:action="@{/upload}" enctype="multipart/form-data" required />
    <input  type="file" name="file" accept="application/pdf" required>
    <br /><br />
    <button type="submit">Upload</button>
    </form>

    <div th:if="${message}">
        <p th:text="${message}"></p>
    </div>

    <div th:if="${size}">
        <p>File size: <span th:text="${size}"></span> bytes</p>
    </div>

</body>

</html>
